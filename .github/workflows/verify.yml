# PR gate. Fast, blocking, runs on every push and pull request.
#
# Scope: compiler/ against the rescued corpus. NOT the full Lib/test metric --
# that lives in metric.yml on a schedule, because it is too slow to block a PR.
#
# This gate enforces CHARTER I6 (the metric may never regress) via
# verify/check_regression.py, not by requiring a fixed pass rate. A project
# starting at 0.0% still gets a meaningful gate on day one: nothing may get
# worse, and no new P0 may appear.
name: verify

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  # A second push must not cancel the run already in progress. A cancelled
  # verify is the red mark on that commit, and it is how a one-line follow-up
  # turned a green push into a failed check.
  cancel-in-progress: false

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # LLVM 22 is newer than what ubuntu-24.04 ships, so it comes from
      # apt.llvm.org. This is the slowest install step; cache it.
      - name: Set up pyc
        uses: ./.github/actions/setup-pyc
        with:
          pgo: "false"          # only affects speed; the oracle is identical
          wheel-check: "none"   # keep the PR gate hermetic; metric.yml proves wheels

      - name: Static checks
        run: |
          set -euxo pipefail
          # A generic `auto` arm silently swallows every node kind CPython adds
          # later; this is the one hole in I4's C++20 guarantee.
          ./compiler/tools/lint_visitors.py compiler/
          # IR well-formedness. Both tools prove they can FAIL before
          # reporting (selfcheck.py), so a green result means something.
          # Widened from compiler/tests to the whole corpus (1035 files,
          # 2026-11-07). It
          # was scoped narrowly because the corpus looked dirty -- 54 findings.
          # Every one was instrument error: ir.cpp printed string constants
          # unescaped, so a NUL or a non-ASCII byte truncated a line and the
          # reader misattributed everything after it, and the checker's %N
          # regex matched inside format strings like "[%10s]". Both fixed, and
          # the corpus is genuinely clean, so this gates at zero findings with
          # no known-failures list.
          ./compiler/tools/check_ir_wellformed.py \
            --lower "./compiler/tools/pyc" \
            --python "$SYSROOT/bin/python3.14" \
            compiler/tests/*.py verify/corpus/language/*.py verify/corpus/programs/*.py
          # M6: a refused compile must name the file, line, and reason
          # (INTERFACES §1.1). The corpus sees DID_NOT_COMPILE either way,
          # so without this step a bare `exit 1` would ride through green.
          ./compiler/tools/check_diagnostics.py --pyc "./compiler/tools/pyc"

      - name: Smoke — the compiler produces a running binary
        run: |
          set -euxo pipefail
          echo 'print(2 ** 200)' > "$RUNNER_TEMP/smoke.py"
          "./compiler/tools/pyc" \
            "$RUNNER_TEMP/smoke.py" -o "$RUNNER_TEMP/smoke"
          got="$("$RUNNER_TEMP/smoke")"
          want="$("$SYSROOT/bin/python3.14" "$RUNNER_TEMP/smoke.py")"
          [ "$got" = "$want" ] || { echo "smoke mismatch: $got != $want"; exit 1; }
          # Tier 1: no libpython dependency, yet dlopen still works.
          ! ldd "$RUNNER_TEMP/smoke" | grep -qi libpython \
            || { echo "smoke binary has a libpython dependency"; exit 1; }

      - name: Wheel milestone (CHARTER I7)
        run: |
          set -euxo pipefail
          # The bet the whole architecture rests on: a compiled binary with no
          # libpython dependency still loads a precompiled C-extension wheel.
          # Proven by hand on 2026-08-22; gated here so it cannot silently
          # regress. numpy rather than torch: same mechanism, far smaller.
          "$SYSROOT/bin/python3.14" -m pip install --quiet --no-input numpy
          cat > "$RUNNER_TEMP/wheel.py" <<'EOP'
          import numpy
          print(numpy.arange(10).sum())
          EOP
          sed -i 's/^          //' "$RUNNER_TEMP/wheel.py"
          "./compiler/tools/pyc" \
            "$RUNNER_TEMP/wheel.py" -o "$RUNNER_TEMP/wheel"
          got="$("$RUNNER_TEMP/wheel")"
          want="$("$SYSROOT/bin/python3.14" "$RUNNER_TEMP/wheel.py")"
          [ "$got" = "$want" ] || { echo "wheel mismatch: $got != $want"; exit 1; }
          ! ldd "$RUNNER_TEMP/wheel" | grep -qi libpython \
            || { echo "wheel binary has a libpython dependency"; exit 1; }

      # --trace / --flamegraph (INTERFACES v1.5): the instrumented build
      # variants. Two things are pinned: (1) DORMANCY -- without the env
      # vars, every variant must behave byte-identically to the unflagged
      # build (stdout, stderr, exit code), so a shipped instrumented binary
      # cannot change clean runs; (2) WELL-FORMEDNESS -- when activated, the
      # trace parses as a balanced Chrome-JSON stream with C slices and the
      # flamegraph parses as XML with at least one frame box.
      - name: Instrumented builds (--trace / --flamegraph)
        run: |
          set -euxo pipefail
          cat > "$RUNNER_TEMP/instr.py" <<'EOP'
          import math

          def inner(x):
              return math.sqrt(x) + math.sin(x)

          def outer(n):
              total = 0
              for i in range(n):
                  total += inner(i + 1)
              return total

          def gen():
              for i in range(4):
                  yield i * 2

          def main():
              try:
                  raise ValueError("expected")
              except ValueError:
                  pass
              print("total", repr(outer(50000)))
              print("gen", list(gen()))

          main()
          EOP
          P=./compiler/tools/pyc
          $P "$RUNNER_TEMP/instr.py" -o "$RUNNER_TEMP/instr" -O0
          $P "$RUNNER_TEMP/instr.py" -o "$RUNNER_TEMP/instr_t" -O0 --trace
          $P "$RUNNER_TEMP/instr.py" -o "$RUNNER_TEMP/instr_f" -O0 --flamegraph
          $P "$RUNNER_TEMP/instr.py" -o "$RUNNER_TEMP/instr_tf" -O0 --trace --flamegraph
          # (1) Dormancy: no env vars -> byte-identical to the plain build.
          "$RUNNER_TEMP/instr" > "$RUNNER_TEMP/out" 2> "$RUNNER_TEMP/err"
          e0=$?
          for v in _t _f _tf; do
            "$RUNNER_TEMP/instr$v" > "$RUNNER_TEMP/out$v" 2> "$RUNNER_TEMP/err$v"
            e1=$?
            [ "$e0" -eq "$e1" ] || { echo "exit code differs for $v ($e0 vs $e1)"; exit 1; }
            cmp -s "$RUNNER_TEMP/out" "$RUNNER_TEMP/out$v" \
              || { echo "stdout differs for $v"; exit 1; }
            cmp -s "$RUNNER_TEMP/err" "$RUNNER_TEMP/err$v" \
              || { echo "stderr differs for $v"; exit 1; }
          done
          # (2) Activation + well-formedness. 999 Hz so a ~50 ms program
          # still collects samples on a loaded runner.
          PYC_TRACE="$RUNNER_TEMP/t.json" "$RUNNER_TEMP/instr_t" > /dev/null
          PYC_FLAMEGRAPH="$RUNNER_TEMP/f.svg" PYC_FLAMEGRAPH_HZ=999 \
            "$RUNNER_TEMP/instr_f" > /dev/null
          PYC_TRACE="$RUNNER_TEMP/ft.json" \
            PYC_FLAMEGRAPH="$RUNNER_TEMP/ft.svg" PYC_FLAMEGRAPH_HZ=999 \
            "$RUNNER_TEMP/instr_tf" > /dev/null
          cat > "$RUNNER_TEMP/check_instr.py" <<'EOP'
          import json, sys
          import xml.etree.ElementTree as ET

          def trace_ok(path):
              evs = [json.loads(l) for l in open(path)]
              assert evs, "empty trace"
              assert any(e["ph"] == "M" for e in evs), "no metadata events"
              assert any(e["ph"] == "B" for e in evs), "no function slices"
              stack = []
              for e in evs:
                  if e["ph"] == "B":
                      stack.append(e["name"])
                  elif e["ph"] == "E":
                      assert stack and stack[-1] == e["name"], "unbalanced B/E"
                      stack.pop()
              assert not stack, "unclosed slices at EOF"
              assert any(e.get("cat") == "pyc.ccall" for e in evs), "no C slices"

          def flame_ok(path):
              root = ET.fromstring(open(path).read())
              # Namespace-tolerant: the svg carries the standard xmlns.
              assert root.tag.split("}")[-1] == "svg", "root is not <svg>"
              titles = [e for e in root.iter() if e.tag.split("}")[-1] == "title"]
              assert len(titles) >= 1, "no frame boxes"

          for p in sys.argv[1:]:
              (trace_ok if p.endswith(".json") else flame_ok)(p)
          EOP
          python3 "$RUNNER_TEMP/check_instr.py" \
            "$RUNNER_TEMP/t.json" "$RUNNER_TEMP/f.svg" \
            "$RUNNER_TEMP/ft.json" "$RUNNER_TEMP/ft.svg"

      - name: Differential run
        run: |
          # known-gaps is gated deliberately. C1 (frames) and C2 (GIL) are
          # closed; residual probes stay in the published number. A baselined
          # failure does not fail the gate; a NEW silent wrong answer does.
          ./verify/measure_run.py \
            --corpus verify/corpus/language \
            --corpus verify/corpus/known-gaps \
            --corpus verify/corpus/concurrency \
            --pyc "./compiler/tools/pyc" \
            --pyc-flag=-O0 \
            --sysroot "$SYSROOT" \
            --jobs "$(nproc)" \
            --run-timeout 15 --compile-timeout 90 \
            --show 12 \
            --json current.json

      # The gate's exit code is the whole point and GitHub throws it away:
      # every nonzero renders as the same red X. Capture it, state in words
      # which of the four outcomes happened, then re-raise it at the end so the
      # job status still reflects reality.
      - name: Monotonicity gate (I6)
        id: gate
        run: |
          set +e
          ./verify/measure_compare.py \
            --baseline compiler/baseline-language.json \
            --require-baseline \
            --current current.json
          code=$?
          set -e
          echo "ok=$([ "$code" -eq 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verdict
        if: always()
        env:
          GATE_CODE: ${{ steps.gate.outputs.code }}
          GATE_OK: ${{ steps.gate.outputs.ok }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import os
          code = os.environ.get("GATE_CODE", "")
          if os.environ.get("GATE_OK") == "yes":
              code = "0"
          trigger = os.environ.get("TRIGGER", "?")
          verdicts = {
            "0": (":white_check_mark:", "GATE RAN — no regression",
                  "The comparison happened and nothing got worse."),
            "1": (":x:", "REGRESSION — the gate ran and FAILED",
                  "A real finding: something the compiler does got worse."),
            "2": (":no_entry:", "GATE DID NOT RUN — results not comparable",
                  "NOTHING WAS VERIFIED. This is not a regression: the "
                  "comparison never happened, so the metric is unguarded. "
                  "Causes: oracle mismatch, compiler-flag mismatch, truncated "
                  "corpus, or a missing baseline."),
            "3": (":warning:", "HARNESS USAGE ERROR",
                  "measure_compare.py was invoked wrongly. Neither a "
                  "regression nor a verified pass."),
          }
          icon, title, detail = verdicts.get(
              code, (":grey_question:", f"UNKNOWN GATE STATE (exit {code!r})",
                     "The gate step did not report an exit code at all."))
          print(f"# {icon} {title}\n")
          print(f"{detail}\n")
          print(f"<sub>trigger: `{trigger}` · gate exit `{code}`</sub>\n")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-results
          path: current.json

      - name: Reflect the gate in the job status
        if: always()
        env:
          GATE_OK: ${{ steps.gate.outputs.ok }}
          GATE_CODE: ${{ steps.gate.outputs.code }}
        run: |
          if [ "$GATE_OK" = "yes" ]; then exit 0; fi
          exit "${GATE_CODE:-1}"

      # Real-world performance smoke (STATUS.md 'Real-world performance').
      # Placed AFTER the gate reflection on purpose: the I6 verdict is
      # authoritative and independent, and a perf harness error must not
      # swallow it. The perf step still fails the job when it fails:
      #   perf_run   exit 1/2 = a workload DID_NOT_COMPILE, MISMATCHed the
      #              oracle, or timed out entirely -- real signals, not noise.
      #   perf_compare exit 2 = records not comparable (pin hash, oracle
      #              version, or flags drifted) -- the harness refusing to
      #              make a claim it cannot make. That IS the finding.
      # Alerts (exit 0, red lines) are trend warnings only: run-to-run
      # variance is characterised in STATUS.md, and the gate on a timing
      # number arrives only when the threshold is earned.
      - name: Perf smoke (--set smoke, pyc -O2 vs sysroot CPython)
        run: |
          set -euxo pipefail
          # Artifacts live in the workspace: upload-artifact@v4 only takes
          # workspace-relative paths (an absolute $RUNNER_TEMP path is
          # dropped with a warning, which is how the first nightly shipped
          # its record without a single trace).
          ./verify/perf_run.py --set smoke \
            --pyc "./compiler/tools/pyc" \
            --pyc-flag=-O2 \
            --sysroot "$SYSROOT" \
            --json perf-smoke.json \
            --artifacts-dir perf-smoke-art
          ./verify/perf_compare.py \
            --current perf-smoke.json \
            --baseline verify/perf/baseline.json

      - name: Perf smoke summary
        if: always()
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          try:
              d = json.load(open("perf-smoke.json"))
          except (OSError, json.JSONDecodeError):
              d = None
          with open(sys.argv[1] if len(sys.argv) > 1 else "/dev/null", "a") as f:
              if d is None:
                  f.write("## Perf smoke\n\nNot summarised: the perf step "
                          "failed or produced no record (see its log).\n")
                  sys.exit(0)
              f.write(f"## Perf smoke (pyc -O2 vs CPython {d['oracle']['version']})\n\n")
              f.write("| workload | class | CPython (s) | pyc (s) | speedup |\n")
              f.write("|---|---|---:|---:|---:|\n")
              for w in d["workloads"]:
                  if w["status"] != "OK":
                      f.write(f"| {w['name']} | {w['cls']} | **{w['status']}** | | |\n")
                      continue
                  f.write(f"| {w['name']} | {w['cls']} "
                          f"| {w['oracle']['median']:.3f} "
                          f"| {w['pyc']['median']:.3f} "
                          f"| {w['speedup']:.2f}x |\n")
              f.write(f"\n<sub>pin {d['pin_hash']} · runs {d['runs']} "
                      f"· {d['host']['class']}</sub>\n")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-smoke-results
          path: |
            perf-smoke.json
            perf-smoke-art
