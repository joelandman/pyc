# PR gate. Fast, blocking, runs on every push and pull request.
#
# Scope: the rescued corpus (verify/corpus). NOT the full Lib/test metric --
# that lives in metric.yml on a schedule, because it is too slow to block a PR.
#
# This gate enforces CHARTER I6 (the metric may never regress) via
# verify/check_regression.py, not by requiring a fixed pass rate. A project
# starting at 0.0% still gets a meaningful gate on day one: nothing may get
# worse, and no new P0 may appear.
name: verify

on:
  push:
    branches: [main, devel, ci-smoke]   # ci-smoke: TEMPORARY, remove before merge
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the version used on the development machine (libmpdec-dev 4.0.1-6).
  MPDEC_VERSION: "4.0.1"

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # LLVM 22 is newer than what ubuntu-24.04 ships, so it comes from
      # apt.llvm.org. This is the slowest install step; cache it.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-llvm22-${{ runner.os }}-v1

      - name: Install toolchain
        run: |
          set -euxo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libpcre2-dev zlib1g-dev python3-dev
          echo "LLVM_DIR=$(llvm-config-22 --cmakedir)" >> "$GITHUB_ENV"

      # Ubuntu 24.04 dropped the mpdecimal source package, so libmpdec-dev
      # cannot be apt-installed here -- CMakeLists.txt treats it as a hard
      # dependency (decimal.Decimal in the old runtime). Build it from source,
      # pinned, so CI does not depend on a package that no longer exists.
      #
      # This step disappears with the rebuild: decimal will come from real
      # CPython, making libmpdec CPython's dependency rather than ours.
      - name: Cache libmpdec
        id: mpdec
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/libmpdec*
          key: mpdec-${{ env.MPDEC_VERSION }}-${{ runner.os }}

      - name: Build libmpdec from source
        if: steps.mpdec.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fsSLO "https://www.bytereef.org/software/mpdecimal/releases/mpdecimal-${MPDEC_VERSION}.tar.gz"
          tar xf "mpdecimal-${MPDEC_VERSION}.tar.gz"
          cd "mpdecimal-${MPDEC_VERSION}"
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      # The runner's system python3 is 3.12, and pyc's frontend calls
      # PyObject_GetOptionalAttrString, which CPython added in 3.13 -- so the
      # tree has an undeclared minimum of CPython >= 3.13 just to BUILD. It
      # compiles on the dev machine only because CMake finds a local 3.14.
      #
      # Building our own sysroot fixes that AND makes CI's differential oracle
      # the same CPython the baseline was recorded against, which a system
      # python3 could never be. --no-pgo because PGO costs 20-40 min and only
      # affects speed, never observable behaviour, so the oracle is identical.
      - name: Cache CPython sysroot
        id: sysroot
        uses: actions/cache@v4
        with:
          path: ~/opt/py-sysroots
          key: sysroot-cp314-3.14.7-tier1-nopgo-${{ hashFiles('tools/build-python-sysroot.sh') }}

      - name: Build CPython sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: ./tools/build-python-sysroot.sh --version 3.14.7 --no-pgo --jobs "$(nproc)"

      - name: Record oracle
        run: |
          echo "SYSROOT=$HOME/opt/py-sysroots/cp314-3.14.7-tier1" >> "$GITHUB_ENV"
          "$HOME/opt/py-sysroots/cp314-3.14.7-tier1/bin/python3.14" -VV

      - name: Build pyc
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_DIR="$LLVM_DIR" \
            -DPython3_ROOT_DIR="$SYSROOT" \
            -DPython3_FIND_STRATEGY=LOCATION
          cmake --build build -j"$(nproc)"

      - name: Differential run
        run: |
          ./verify/run.py \
            --corpus verify/corpus/language \
            --corpus verify/corpus/programs \
            --sysroot "$SYSROOT" \
            --jobs "$(nproc)" \
            --run-timeout 15 --compile-timeout 90 \
            --show 12 \
            --json current.json

      - name: Monotonicity gate (I6)
        run: ./verify/check_regression.py --current current.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-results
          path: current.json
