# PR gate. Fast, blocking, runs on every push and pull request.
#
# Scope: the NEW tree (compiler/) against the rescued corpus. NOT the full
# Lib/test metric -- that lives in metric.yml on a schedule, because it is too
# slow to block a PR.
#
# The old tree under src/ is deliberately NOT built or gated here. Its 97.8%
# came with five P0 silent wrong answers and hardcoded expectations that had
# recorded its own bugs as correct; keeping that gate green would enforce the
# property the architecture review argued is worthless.
#
# This gate enforces CHARTER I6 (the metric may never regress) via
# verify/check_regression.py, not by requiring a fixed pass rate. A project
# starting at 0.0% still gets a meaningful gate on day one: nothing may get
# worse, and no new P0 may appear.
name: verify

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # LLVM 22 is newer than what ubuntu-24.04 ships, so it comes from
      # apt.llvm.org. This is the slowest install step; cache it.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-llvm22-${{ runner.os }}-v1

      - name: Install toolchain
        run: |
          set -euxo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          # The new tree needs clang++ (to compile it, and to assemble the
          # LLVM IR it emits) plus CPython's build deps for the sysroot.
          # libmpdec and the LLVM CMake package were old-tree dependencies:
          # its runtime reimplemented decimal, which now comes from CPython.
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libssl-dev libffi-dev libbz2-dev liblzma-dev \
            libsqlite3-dev libreadline-dev libncurses-dev uuid-dev
          echo "PYC_CXX=clang++-22" >> "$GITHUB_ENV"

      # The runner's system python3 is 3.12, and pyc's frontend calls
      # PyObject_GetOptionalAttrString, which CPython added in 3.13 -- so the
      # tree has an undeclared minimum of CPython >= 3.13 just to BUILD. It
      # compiles on the dev machine only because CMake finds a local 3.14.
      #
      # Building our own sysroot fixes that AND makes CI's differential oracle
      # the same CPython the baseline was recorded against, which a system
      # python3 could never be. --no-pgo because PGO costs 20-40 min and only
      # affects speed, never observable behaviour, so the oracle is identical.
      - name: Cache CPython sysroot
        id: sysroot
        uses: actions/cache@v4
        with:
          path: ~/opt/py-sysroots
          key: sysroot-cp314-3.14.7-tier1-nopgo-${{ hashFiles('tools/build-python-sysroot.sh') }}

      - name: Build CPython sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          # --no-wheel-check keeps the PR gate hermetic: a PyPI outage must not
          # fail unrelated PRs. The nightly metric proves wheels with
          # --require-wheel instead.
          ./tools/build-python-sysroot.sh --version 3.14.7 --no-pgo \
            --no-wheel-check --jobs "$(nproc)"

      - name: Record oracle
        run: |
          echo "SYSROOT=$HOME/opt/py-sysroots/cp314-3.14.7-tier1" >> "$GITHUB_ENV"
          "$HOME/opt/py-sysroots/cp314-3.14.7-tier1/bin/python3.14" -VV

      - name: Build the compiler
        run: |
          set -euxo pipefail
          # The new tree has no CMake yet: it is a handful of translation
          # units, so it is built directly. Replace this when a build system
          # lands rather than growing the command.
          clang++-22 -std=c++20 -O2 -I compiler/include \
            compiler/src/pyc_lower_main.cpp compiler/src/lower.cpp \
            compiler/src/scope.cpp compiler/src/ir.cpp compiler/src/codegen.cpp \
            compiler/src/capi.cpp compiler/src/ast_support.cpp \
            compiler/src/json.cpp -o "$RUNNER_TEMP/pyc_lower"
          echo "PYC_LOWER=$RUNNER_TEMP/pyc_lower" >> "$GITHUB_ENV"

      - name: Static checks
        run: |
          set -euxo pipefail
          # A generic `auto` arm silently swallows every node kind CPython adds
          # later; this is the one hole in I4's C++20 guarantee.
          ./compiler/tools/lint_visitors.py compiler/
          # IR well-formedness. Both tools prove they can FAIL before
          # reporting (selfcheck.py), so a green result means something.
          ./compiler/tools/check_ir_wellformed.py \
            --lower "$RUNNER_TEMP/pyc_lower" \
            --python "$SYSROOT/bin/python3.14" \
            compiler/tests/*.py

      - name: Smoke — the compiler produces a running binary
        run: |
          set -euxo pipefail
          echo 'print(2 ** 200)' > "$RUNNER_TEMP/smoke.py"
          PYC_LOWER="$RUNNER_TEMP/pyc_lower" ./compiler/tools/pycc \
            "$RUNNER_TEMP/smoke.py" -o "$RUNNER_TEMP/smoke"
          got="$("$RUNNER_TEMP/smoke")"
          want="$("$SYSROOT/bin/python3.14" "$RUNNER_TEMP/smoke.py")"
          [ "$got" = "$want" ] || { echo "smoke mismatch: $got != $want"; exit 1; }
          # Tier 1: no libpython dependency, yet dlopen still works.
          ! ldd "$RUNNER_TEMP/smoke" | grep -qi libpython \
            || { echo "smoke binary has a libpython dependency"; exit 1; }

      - name: Wheel milestone (CHARTER I7)
        run: |
          set -euxo pipefail
          # The bet the whole architecture rests on: a compiled binary with no
          # libpython dependency still loads a precompiled C-extension wheel.
          # Proven by hand on 2026-08-22; gated here so it cannot silently
          # regress. numpy rather than torch: same mechanism, far smaller.
          "$SYSROOT/bin/python3.14" -m pip install --quiet --no-input numpy
          cat > "$RUNNER_TEMP/wheel.py" <<'EOP'
          import numpy
          print(numpy.arange(10).sum())
          EOP
          sed -i 's/^          //' "$RUNNER_TEMP/wheel.py"
          PYC_LOWER="$RUNNER_TEMP/pyc_lower" ./compiler/tools/pycc \
            "$RUNNER_TEMP/wheel.py" -o "$RUNNER_TEMP/wheel"
          got="$("$RUNNER_TEMP/wheel")"
          want="$("$SYSROOT/bin/python3.14" "$RUNNER_TEMP/wheel.py")"
          [ "$got" = "$want" ] || { echo "wheel mismatch: $got != $want"; exit 1; }
          ! ldd "$RUNNER_TEMP/wheel" | grep -qi libpython \
            || { echo "wheel binary has a libpython dependency"; exit 1; }

      - name: Differential run
        run: |
          PYC_LOWER="$RUNNER_TEMP/pyc_lower" ./verify/run.py \
            --corpus verify/corpus/language \
            --pyc "$PWD/compiler/tools/pycc" \
            --pyc-flag -O0 \
            --sysroot "$SYSROOT" \
            --jobs "$(nproc)" \
            --run-timeout 15 --compile-timeout 90 \
            --show 12 \
            --json current.json

      - name: Monotonicity gate (I6)
        run: |
          # Gate against the NEW tree's baseline. The old tree's
          # verify/baseline.json records 97.8% with FIVE P0 silent wrong
          # answers, and gating on it would enforce exactly the property the
          # review argued is worthless.
          ./verify/check_regression.py \
            --baseline compiler/baseline-language.json \
            --current current.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-results
          path: current.json
