# The north-star metric (CHARTER I6): pass rate over CPython's own Lib/test.
#
# Scheduled, not per-PR: the full suite is far too slow to block a merge, and
# the number is a trend rather than a gate. It is published low and honest.
#
# The gate on this workflow is monotonicity, same as verify.yml. A drop must be
# explained, not absorbed.
name: metric

on:
  schedule:
    - cron: "0 6 * * *"      # nightly, 06:00 UTC
  workflow_dispatch:
    inputs:
      libtest_limit:
        description: "Cap the number of Lib/test files (blank = all)"
        required: false
        default: ""

concurrency:
  group: metric
  cancel-in-progress: false

env:
  # One place for the version both jobs build against. setup-pyc's own
  # default used to be the only copy, and drift between the two consumers
  # is how this workflow already bit the project once.
  CPYTHON_VERSION: "3.14.7"

jobs:
  libtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          ref: devel

      - name: Set up pyc
        uses: ./.github/actions/setup-pyc
        with:
          cpython-version: ${{ env.CPYTHON_VERSION }}
          pgo: "true"              # nightly can afford it
          wheel-check: "require"   # CHARTER I7 as a daily hard gate

      - name: Match the baseline's interpreter set
        run: |
          set -euxo pipefail
          # test_xpickle spawns pythonX.Y for every older minor it finds on
          # PATH (python2.7 and python3.2 .. python3.13 when the subject is
          # 3.14). The published baseline was measured with only the sysroot
          # 3.14, so those bodies were skipped. ubuntu-24.04 has python3.12
          # on PATH; the nightly runs that body and the compiled side exits 1.
          # That failure is on every morning run and is not a new commit.
          #
          # The harness is #!/usr/bin/env python3, and on this image python3
          # is Python 3.12. xpickle looks up the versioned name, not python3.
          # Keep that interpreter under a name xpickle does not search, then
          # remove every versioned binary from PATH. python3.14 stays: it is
          # this metric's oracle minor, and xpickle does not spawn current.
          # A copy left anywhere on PATH still counts, including the tool
          # cache, so this walks PATH rather than only /usr/bin.
          py3="$(readlink -f "$(command -v python3)")"
          sudo cp -a "$py3" /usr/bin/python3.metric-keep
          sudo ln -sfn /usr/bin/python3.metric-keep /usr/bin/python3
          hide_versioned() {
            local d b base
            shopt -s nullglob
            IFS=':' read -r -a _pyc_path_dirs <<< "$PATH"
            for d in "${_pyc_path_dirs[@]}"; do
              [ -d "$d" ] || continue
              for b in "$d"/python[0-9].[0-9]* "$d"/python[0-9][0-9].[0-9]*; do
                base="$(basename "$b")"
                case "$base" in
                  python3.14|python3.14-config) ;;
                  *) "$@" "$b" ;;
                esac
              done
            done
          }
          hide_versioned sudo rm -f
          # Fail here, before an hour of Lib/test, if a versioned interpreter
          # is still executable. Otherwise the miss comes back as a fake
          # regression on test_xpickle.py.
          leftover=0
          mark_leftover() { echo "still on PATH: $1"; leftover=1; }
          hide_versioned mark_leftover
          [ "$leftover" -eq 0 ]
          python3 -c 'import sys; print("harness python", sys.version)'

      - name: Lib/test metric
        run: |
          LIMIT=""
          if [ -n "${{ inputs.libtest_limit }}" ]; then
            LIMIT="--libtest-limit ${{ inputs.libtest_limit }}"
          fi
          # The 11 files in verify/longrunning.py stay in the I6 denominator.
          # Default longrunning workers are one per core. On this 4-core
          # runner that starts test_zipfile64 beside three other 600s
          # files; every scheduled run since 2026-09-25 has died with
          # exit 143 (runner shutdown) at "--- longrunning ---", before
          # the monotonicity step. One worker keeps the files and the
          # 600s budget. Do not drop a file to make the job green.
          ./verify/measure_run.py --libtest $LIMIT \
            --pyc "$PWD/compiler/tools/pycc" \
            --pyc-flag=-O0 \
            --sysroot "$SYSROOT" \
            --stdlib "$SYSROOT/lib/python3.14" \
            --jobs 4 \
            --longrunning-jobs 1 \
            --run-timeout 30 --compile-timeout 120 \
            --show 20 \
            --json libtest.json

      # The gate's exit code is the whole point and GitHub throws it away:
      # every nonzero renders as the same red X. Capture it, state in words
      # which of the four outcomes happened, then re-raise it at the end so the
      # job status still reflects reality.
      - name: Monotonicity gate (I6)
        id: gate
        run: |
          set +e
          ./verify/measure_compare.py \
            --baseline compiler/baseline-libtest.json \
            --require-baseline \
            --current libtest.json
          code=$?
          set -e
          echo "ok=$([ "$code" -eq 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verdict
        if: always()
        env:
          GATE_CODE: ${{ steps.gate.outputs.code }}
          GATE_OK: ${{ steps.gate.outputs.ok }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import os
          code = os.environ.get("GATE_CODE", "")
          if os.environ.get("GATE_OK") == "yes":
              code = "0"
          trigger = os.environ.get("TRIGGER", "?")
          verdicts = {
            "0": (":white_check_mark:", "GATE RAN — no regression",
                  "The comparison happened and nothing got worse."),
            "1": (":x:", "REGRESSION — the gate ran and FAILED",
                  "A real finding: something the compiler does got worse."),
            "2": (":no_entry:", "GATE DID NOT RUN — results not comparable",
                  "NOTHING WAS VERIFIED. This is not a regression: the "
                  "comparison never happened, so the metric is unguarded. "
                  "Causes: oracle mismatch, compiler-flag mismatch, truncated "
                  "corpus, or a missing baseline."),
            "3": (":warning:", "HARNESS USAGE ERROR",
                  "measure_compare.py was invoked wrongly. Neither a "
                  "regression nor a verified pass."),
          }
          icon, title, detail = verdicts.get(
              code, (":grey_question:", f"UNKNOWN GATE STATE (exit {code!r})",
                     "The gate step did not report an exit code at all."))
          print(f"# {icon} {title}\n")
          print(f"{detail}\n")
          print(f"<sub>trigger: `{trigger}` · gate exit `{code}`</sub>\n")
          EOF

      - name: Publish the number
        if: always()
        run: |
          # tee, not >>: output must reach the run LOG as well as the step
          # summary, or tools/check-nightly.sh cannot read the number back.
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("libtest.json"))
          print("## CPython `Lib/test/` pass rate\n")
          print(f"### **{d['pass_rate']:.2f}%**  ({d['passing']}/{d['total']} files)\n")
          # The denominator is every file measured. Nothing is excluded, so
          # this number cannot move because the scored set changed under it --
          # which the old quarantined denominator could, and did.
          print(f"<sub>{d['clean']} byte-identical on stdout, stderr and exit "
                f"status</sub>\n")
          print("| flag | count | |\n|---|---|---|")
          impactful = {"DID_NOT_COMPILE", "ORACLE_UNSTABLE", "TIMEOUT",
                       "STDOUT_DIFFERS", "EXIT_DIFFERS"}
          for k, v in sorted(d["counts"].items()):
              print(f"| `{k}` | {v} | {'counts against the rate' if k in impactful else ''} |")
          # I1, read straight off the record: exit 0 and the wrong answer.
          silent = [r["case"] for r in d["results"]
                    if "STDOUT_DIFFERS" in r["flags"]
                    and (r["exit"] or {}).get("subject") == 0]
          if silent:
              print(f"\n**{len(silent)} silent wrong answer(s)** — exited 0 and "
                    f"printed something other than Python's answer (CHARTER I1).")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libtest-metric
          path: libtest.json

      - name: Reflect the gate in the job status
        if: always()
        env:
          GATE_OK: ${{ steps.gate.outputs.ok }}
          GATE_CODE: ${{ steps.gate.outputs.code }}
        run: |
          if [ "$GATE_OK" = "yes" ]; then exit 0; fi
          exit "${GATE_CODE:-1}"

  # Leak bar (B8): the runtime C code that Lib/test cannot reach. CPython's
  # suite exercises the interpreter, not pyc's trampolines; a refcount leak
  # in the trampoline surfaces nowhere else. The harness runs workloads
  # against a Py_REF_DEBUG sysroot and requires a flat per-iteration slope,
  # EXCEPT the `leak` workload, which must leak -- the negative control that
  # proves the harness can fail. A leak-detector that never detected a leak
  # is not evidence of anything.
  #
  # The debug sysroot (cp314d) is a distinct ABI and distinct data from
  # libtest's release sysroot, so it gets its own cache key. Same
  # split-restore/save as setup-pyc: a cache/save bound to job-end would
  # discard the ~10 min build on every red run.
  leak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: devel

      - name: Install toolchain
        shell: bash
        run: |
          set -euxo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libssl-dev libffi-dev libbz2-dev liblzma-dev \
            libsqlite3-dev libreadline-dev libncurses-dev uuid-dev

      - name: Restore debug sysroot
        id: dbg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/opt/py-sysroots
          key: sysroot-cp314d-${{ env.CPYTHON_VERSION }}-tier1-nopgo-${{ hashFiles('tools/build-python-sysroot.sh') }}

      - name: Build debug sysroot
        if: steps.dbg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          ./tools/build-python-sysroot.sh \
            --version '${{ env.CPYTHON_VERSION }}' --debug --no-pgo \
            --no-wheel-check --jobs "$(nproc)"

      - name: Save debug sysroot
        if: steps.dbg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/opt/py-sysroots
          key: sysroot-cp314d-${{ env.CPYTHON_VERSION }}-tier1-nopgo-${{ hashFiles('tools/build-python-sysroot.sh') }}

      - name: Build the leak probe
        shell: bash
        run: |
          set -euxo pipefail
          make -C compiler refcount-probe \
            CXX=clang++-22 \
            DBG_SYSROOT="$HOME/opt/py-sysroots/cp314d-${{ env.CPYTHON_VERSION }}-tier1" \
            PROBE_OUT="$RUNNER_TEMP/pyc_refcount_probe"

      - name: Run the leak bar
        id: bar
        shell: bash
        run: |
          set -euxo pipefail
          # exit 0 = workloads flat AND the negative control leaked
          # exit 1 = a workload moved, or the control did not leak
          # exit 2 = not a Py_REF_DEBUG build (wrong sysroot)
          "$RUNNER_TEMP/pyc_refcount_probe"

      - name: Verdict
        if: always()
        shell: bash
        run: |
          # tee, not >>: tools/check-nightly.sh reads this banner back from
          # the run log, and the log does not carry the step summary.
          case "${{ steps.bar.outcome }}" in
            success) echo "LEAK BAR: PASS — workloads flat, negative control detected" ;;
            failure) echo "LEAK BAR: FAIL — a workload moved, or the negative control did not leak" ;;
            *)       echo "LEAK BAR: NOT RUN — an earlier step failed" ;;
          esac | tee -a "$GITHUB_STEP_SUMMARY"
