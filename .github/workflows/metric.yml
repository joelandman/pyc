# The north-star metric (CHARTER I6): pass rate over CPython's own Lib/test.
#
# Scheduled, not per-PR: the full suite is far too slow to block a merge, and
# the number is a trend rather than a gate. It is published low and honest.
#
# The gate on this workflow is monotonicity, same as verify.yml. A drop must be
# explained, not absorbed.
name: metric

on:
  schedule:
    - cron: "0 6 * * *"      # nightly, 06:00 UTC
  workflow_dispatch:
    inputs:
      libtest_limit:
        description: "Cap the number of Lib/test files (blank = all)"
        required: false
        default: ""

concurrency:
  group: metric
  cancel-in-progress: false

jobs:
  libtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          ref: devel

      - name: Set up pyc
        uses: ./.github/actions/setup-pyc
        with:
          pgo: "true"              # nightly can afford it
          wheel-check: "require"   # CHARTER I7 as a daily hard gate

      - name: Lib/test metric
        run: |
          LIMIT=""
          if [ -n "${{ inputs.libtest_limit }}" ]; then
            LIMIT="--libtest-limit ${{ inputs.libtest_limit }}"
          fi
          ./verify/run.py --libtest $LIMIT \
            --pyc "$PWD/compiler/tools/pycc" \
            --pyc-flag -O0 \
            --sysroot "$SYSROOT" \
            --stdlib "$SYSROOT/lib/python3.14" \
            --jobs "$(nproc)" \
            --run-timeout 30 --compile-timeout 120 \
            --show 20 \
            --json libtest.json

      - name: Monotonicity gate (I6)
        run: |
          ./verify/check_regression.py \
            --baseline compiler/baseline-libtest.json \
            --require-baseline \
            --current libtest.json

      - name: Publish the number
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("libtest.json"))
          print("## CPython `Lib/test/` pass rate\n")
          total = d.get("total_cases", len(d["results"]))
          print(f"### **{d['pass_rate']:.2f}%**  ({d['matched']}/{total} files)\n")
          # Deliberately secondary: its denominator is the scored set, which
          # varies run to run with quarantine flakiness.
          print(f"<sub>{d.get('scored_rate', 0):.2f}% of the "
                f"{d['scored']} scored ({d['quarantined']} quarantined)</sub>\n")
          print("| verdict | count |\n|---|---|")
          for k, v in sorted(d["counts"].items()):
              print(f"| `{k}` | {v} |")
          p0 = d["counts"].get("SILENT_WRONG_ANSWER", 0)
          if p0:
              print(f"\n**{p0} P0 silent wrong answer(s)** — ranked above every crash (CHARTER I1).")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libtest-metric
          path: libtest.json
