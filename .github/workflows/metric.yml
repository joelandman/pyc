# The north-star metric (CHARTER I6): pass rate over CPython's own Lib/test.
#
# Scheduled, not per-PR: the full suite is far too slow to block a merge, and
# the number is a trend rather than a gate. It is published low and honest.
#
# The gate on this workflow is monotonicity, same as verify.yml. A drop must be
# explained, not absorbed.
name: metric

on:
  schedule:
    - cron: "0 6 * * *"      # nightly, 06:00 UTC
  workflow_dispatch:
    inputs:
      libtest_limit:
        description: "Cap the number of Lib/test files (blank = all)"
        required: false
        default: ""

concurrency:
  group: metric
  cancel-in-progress: false

jobs:
  libtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          ref: devel

      - name: Set up pyc
        uses: ./.github/actions/setup-pyc
        with:
          pgo: "true"              # nightly can afford it
          wheel-check: "require"   # CHARTER I7 as a daily hard gate

      - name: Lib/test metric
        run: |
          LIMIT=""
          if [ -n "${{ inputs.libtest_limit }}" ]; then
            LIMIT="--libtest-limit ${{ inputs.libtest_limit }}"
          fi
          ./verify/measure_run.py --libtest $LIMIT \
            --pyc "$PWD/compiler/tools/pycc" \
            --pyc-flag=-O0 \
            --sysroot "$SYSROOT" \
            --stdlib "$SYSROOT/lib/python3.14" \
            --jobs 4 \
            --run-timeout 30 --compile-timeout 120 \
            --show 20 \
            --json libtest.json

      # The gate's exit code is the whole point and GitHub throws it away:
      # every nonzero renders as the same red X. Capture it, state in words
      # which of the four outcomes happened, then re-raise it at the end so the
      # job status still reflects reality.
      - name: Monotonicity gate (I6)
        id: gate
        run: |
          set +e
          ./verify/measure_compare.py \
            --baseline compiler/baseline-libtest.json \
            --require-baseline \
            --current libtest.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verdict
        if: always()
        env:
          GATE_CODE: ${{ steps.gate.outputs.code }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import os
          code = os.environ.get("GATE_CODE", "")
          trigger = os.environ.get("TRIGGER", "?")
          verdicts = {
            "0": (":white_check_mark:", "GATE RAN — no regression",
                  "The comparison happened and nothing got worse."),
            "1": (":x:", "REGRESSION — the gate ran and FAILED",
                  "A real finding: something the compiler does got worse."),
            "2": (":no_entry:", "GATE DID NOT RUN — results not comparable",
                  "NOTHING WAS VERIFIED. This is not a regression: the "
                  "comparison never happened, so the metric is unguarded. "
                  "Causes: oracle mismatch, compiler-flag mismatch, truncated "
                  "corpus, or a missing baseline."),
            "3": (":warning:", "HARNESS USAGE ERROR",
                  "measure_compare.py was invoked wrongly. Neither a "
                  "regression nor a verified pass."),
          }
          icon, title, detail = verdicts.get(
              code, (":grey_question:", f"UNKNOWN GATE STATE (exit {code!r})",
                     "The gate step did not report an exit code at all."))
          print(f"# {icon} {title}\n")
          print(f"{detail}\n")
          print(f"<sub>trigger: `{trigger}` · gate exit `{code}`</sub>\n")
          EOF

      - name: Publish the number
        if: always()
        run: |
          # tee, not >>: output must reach the run LOG as well as the step
          # summary, or tools/check-nightly.sh cannot read the number back.
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("libtest.json"))
          print("## CPython `Lib/test/` pass rate\n")
          print(f"### **{d['pass_rate']:.2f}%**  ({d['passing']}/{d['total']} files)\n")
          # The denominator is every file measured. Nothing is excluded, so
          # this number cannot move because the scored set changed under it --
          # which the old quarantined denominator could, and did.
          print(f"<sub>{d['clean']} byte-identical on stdout, stderr and exit "
                f"status</sub>\n")
          print("| flag | count | |\n|---|---|---|")
          impactful = {"DID_NOT_COMPILE", "ORACLE_UNSTABLE", "TIMEOUT",
                       "STDOUT_DIFFERS", "EXIT_DIFFERS"}
          for k, v in sorted(d["counts"].items()):
              print(f"| `{k}` | {v} | {'counts against the rate' if k in impactful else ''} |")
          # I1, read straight off the record: exit 0 and the wrong answer.
          silent = [r["case"] for r in d["results"]
                    if "STDOUT_DIFFERS" in r["flags"]
                    and (r["exit"] or {}).get("subject") == 0]
          if silent:
              print(f"\n**{len(silent)} silent wrong answer(s)** — exited 0 and "
                    f"printed something other than Python's answer (CHARTER I1).")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libtest-metric
          path: libtest.json

      - name: Reflect the gate in the job status
        if: always()
        run: exit ${{ steps.gate.outputs.code || 1 }}
